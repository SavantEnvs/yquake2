// script exercising the interpreter: cvars, macros, aliases, quoting, vstr, wait
set name "Player One"
set fov 90 a
set hostname "yq2 \"fuzz\" server" s
set msg1 "echo first;echo second"
alias greet "echo hello $name ; echo fov=$fov"
greet
vstr msg1
toggle cl_run
inc fov 5
echo fov now $fov
alias loop "echo tick; wait; loop2"
alias loop2 "echo tock"
loop
cvarlist
cmdlist
reset fov
echo "quoted ; not split" ; echo after
exec missing.cfg
unalias greet
